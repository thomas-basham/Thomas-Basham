  <body>
    <div class="app-shell">
      <canvas
        id="world"
        tabindex="-1"
        aria-label="Three-dimensional portfolio world"
      ></canvas>

      <main class="hud" aria-label="Portfolio interface">
        <header class="top-bar">
          <div class="top-bar__brand">
            <span class="eyebrow" id="brand-eyebrow"></span>
            <h1 id="brand-title"></h1>
          </div>

          <div class="top-bar__status">
            <span id="zone-name"></span>
            <span id="zone-distance"></span>
          </div>

          <div class="top-bar__utilities">
            <div class="utility-actions">
              <button
                class="utility-button"
                id="portfolio-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="fallback-panel"
              ></button>
              <button
                class="utility-button"
                id="pointer-toggle"
                type="button"
                aria-describedby="pointer-hint"
              ></button>
              <button
                class="utility-button"
                id="settings-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="settings-panel"
              ></button>
            </div>
            <p
              class="utility-hint"
              id="pointer-hint"
              role="status"
              aria-live="polite"
            ></p>

            <aside
              class="quick-cta"
              id="fallback-cta"
              aria-labelledby="fallback-cta-title"
            >
              <span class="eyebrow" id="fallback-cta-eyebrow"></span>
              <h2 id="fallback-cta-title"></h2>
              <p id="fallback-cta-body"></p>
              <div class="quick-cta__actions" id="fallback-cta-actions"></div>
            </aside>
          </div>
        </header>

        <section
          class="panel panel--settings hidden"
          id="settings-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="settings-title"
          aria-describedby="settings-note"
          tabindex="-1"
        >
          <div class="panel__header panel__header--spread">
            <div>
              <span class="eyebrow" id="settings-eyebrow"></span>
              <h2 id="settings-title"></h2>
            </div>
            <button
              class="utility-button utility-button--compact"
              id="settings-close"
              type="button"
            ></button>
          </div>

          <div class="settings-list">
            <div class="setting-row">
              <div class="setting-copy">
                <h3 id="reduced-motion-label"></h3>
                <p id="reduced-motion-description"></p>
              </div>
              <button
                class="toggle-chip"
                id="reduced-motion-toggle"
                type="button"
              ></button>
            </div>

            <div class="setting-row">
              <div class="setting-copy">
                <h3 id="sensitivity-label"></h3>
              </div>
              <div
                class="setting-options"
                id="sensitivity-options"
                role="group"
                aria-labelledby="sensitivity-label"
              ></div>
            </div>

            <div class="setting-row">
              <div class="setting-copy">
                <h3 id="graphics-label"></h3>
              </div>
              <div
                class="setting-options"
                id="graphics-options"
                role="group"
                aria-labelledby="graphics-label"
              ></div>
            </div>
          </div>

          <p class="settings-note" id="settings-note"></p>
        </section>

        <section
          class="panel panel--intro"
          id="intro-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="intro-title"
          aria-describedby="intro-body"
          tabindex="-1"
        >
          <span class="eyebrow" id="intro-eyebrow"></span>
          <h2 id="intro-title"></h2>
          <p id="intro-body"></p>

          <div class="intro-grid" id="intro-grid"></div>

          <div class="panel__actions" id="intro-actions"></div>
        </section>

        <section
          class="fallback-panel hidden"
          id="fallback-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="fallback-hero-title"
          aria-describedby="fallback-hero-body fallback-status"
          tabindex="-1"
        >
          <div class="fallback-panel__inner">
            <header class="fallback-hero">
              <div class="fallback-hero__copy">
                <span class="eyebrow" id="fallback-hero-eyebrow"></span>
                <h2 id="fallback-hero-title"></h2>
                <p class="fallback-hero__kicker" id="fallback-hero-kicker"></p>
                <p id="fallback-hero-body"></p>
              </div>

              <div class="fallback-hero__actions">
                <div class="panel__actions" id="fallback-hero-actions"></div>
                <button
                  class="utility-button fallback-close"
                  id="fallback-close"
                  type="button"
                ></button>
              </div>
            </header>

            <p
              class="fallback-status hidden"
              id="fallback-status"
              role="status"
            ></p>

            <div class="fallback-sections" id="fallback-sections"></div>
          </div>
        </section>

        <section
          class="panel panel--inspect hidden"
          id="inspect-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="inspect-title"
          aria-describedby="inspect-body"
          tabindex="-1"
        >
          <span class="eyebrow" id="inspect-zone"></span>
          <h2 id="inspect-title"></h2>
          <p class="panel__kicker" id="inspect-kicker"></p>
          <p id="inspect-body"></p>
          <ul class="panel__bullets" id="inspect-bullets"></ul>
          <div class="panel__actions" id="inspect-actions"></div>
        </section>

        <button
          class="prompt hidden"
          id="inspect-prompt"
          type="button"
          aria-live="polite"
          aria-atomic="true"
          aria-haspopup="dialog"
          aria-controls="inspect-panel"
        >
          <span class="prompt__eyebrow" id="prompt-eyebrow"></span>
          <span class="prompt__title" id="prompt-title"></span>
          <span class="prompt__hint" id="prompt-hint"></span>
        </button>

        <aside class="legend" id="controls-legend">
          <span class="eyebrow" id="controls-eyebrow"></span>
          <p id="controls-copy"></p>
        </aside>

        <aside class="debug-panel hidden" id="debug-panel" aria-live="off">
          <span class="eyebrow" id="debug-title"></span>
          <p class="debug-panel__row" id="debug-fps"></p>
          <p class="debug-panel__row" id="debug-quality"></p>
          <p class="debug-panel__row" id="debug-draws"></p>
          <p class="debug-panel__row" id="debug-triangles"></p>
        </aside>

        <div class="crosshair" id="crosshair" aria-hidden="true"></div>

        <section
          class="mobile-controls"
          id="mobile-controls"
          aria-label="Mobile controls"
        >
          <div class="control-pad" role="group" aria-label="Movement controls">
            <button
              class="control-button"
              data-control="forward"
              type="button"
              aria-label="Move forward"
            >
              ▲
            </button>
            <button
              class="control-button"
              data-control="left"
              type="button"
              aria-label="Move left"
            >
              ◀
            </button>
            <button
              class="control-button"
              data-control="backward"
              type="button"
              aria-label="Move backward"
            >
              ▼
            </button>
            <button
              class="control-button"
              data-control="right"
              type="button"
              aria-label="Move right"
            >
              ▶
            </button>
          </div>

          <div
            class="control-pad control-pad--look"
            role="group"
            aria-label="Look controls"
          >
            <button
              class="control-button"
              data-control="lookUp"
              type="button"
              aria-label="Look up"
            >
              ▲
            </button>
            <button
              class="control-button"
              data-control="turnLeft"
              type="button"
              aria-label="Turn left"
            >
              ◀
            </button>
            <button
              class="control-button"
              data-control="lookDown"
              type="button"
              aria-label="Look down"
            >
              ▼
            </button>
            <button
              class="control-button"
              data-control="turnRight"
              type="button"
              aria-label="Turn right"
            >
              ▶
            </button>
          </div>

          <div class="mobile-actions">
            <button
              class="control-button control-button--wide"
              data-control="sprint"
              type="button"
            >
              <span id="mobile-sprint-label"></span>
            </button>
            <button
              class="control-button control-button--wide"
              id="mobile-inspect"
              type="button"
            >
              <span id="mobile-inspect-label"></span>
            </button>
          </div>
        </section>
      </main>
    </div>

    <noscript>
      <div class="noscript">
        <span id="noscript-copy"
          >JavaScript is required for the 3D portfolio.</span
        >
      </div>
    </noscript>

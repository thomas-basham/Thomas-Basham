<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Walk through a fantasy world and explore Thomas Basham's projects, stack, certifications, and contact links."
    />
    <title>Thomas Basham | Fantasy Portfolio Realm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <canvas id="world" aria-label="Three-dimensional portfolio world"></canvas>

      <div class="hud">
        <header class="top-bar">
          <div class="top-bar__brand">
            <span class="eyebrow" id="brand-eyebrow"></span>
            <h1 id="brand-title"></h1>
          </div>

          <div class="top-bar__status">
            <span id="zone-name"></span>
            <span id="zone-distance"></span>
          </div>

          <div class="top-bar__utilities">
            <div class="utility-actions">
              <button class="utility-button" id="pointer-toggle" type="button"></button>
              <button
                class="utility-button"
                id="settings-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="settings-panel"
              ></button>
            </div>
            <p class="utility-hint" id="pointer-hint"></p>
          </div>
        </header>

        <section
          class="panel panel--settings hidden"
          id="settings-panel"
          aria-labelledby="settings-title"
        >
          <span class="eyebrow" id="settings-eyebrow"></span>
          <h2 id="settings-title"></h2>

          <div class="settings-list">
            <div class="setting-row">
              <div class="setting-copy">
                <h3 id="reduced-motion-label"></h3>
                <p id="reduced-motion-description"></p>
              </div>
              <button class="toggle-chip" id="reduced-motion-toggle" type="button"></button>
            </div>

            <div class="setting-row">
              <div class="setting-copy">
                <h3 id="sensitivity-label"></h3>
              </div>
              <div class="setting-options" id="sensitivity-options" role="group"></div>
            </div>

            <div class="setting-row">
              <div class="setting-copy">
                <h3 id="graphics-label"></h3>
              </div>
              <div class="setting-options" id="graphics-options" role="group"></div>
            </div>
          </div>

          <p class="settings-note" id="settings-note"></p>
        </section>

        <section class="panel panel--intro" id="intro-panel">
          <span class="eyebrow" id="intro-eyebrow"></span>
          <h2 id="intro-title"></h2>
          <p id="intro-body"></p>

          <div class="intro-grid" id="intro-grid"></div>

          <div class="panel__actions" id="intro-actions"></div>
        </section>

        <section class="panel panel--inspect hidden" id="inspect-panel" aria-live="polite">
          <span class="eyebrow" id="inspect-zone"></span>
          <h2 id="inspect-title"></h2>
          <p class="panel__kicker" id="inspect-kicker"></p>
          <p id="inspect-body"></p>
          <ul class="panel__bullets" id="inspect-bullets"></ul>
          <div class="panel__actions" id="inspect-actions"></div>
        </section>

        <button class="prompt hidden" id="inspect-prompt" type="button">
          <span class="prompt__eyebrow" id="prompt-eyebrow"></span>
          <span class="prompt__title" id="prompt-title"></span>
          <span class="prompt__hint" id="prompt-hint"></span>
        </button>

        <aside class="legend" id="controls-legend">
          <span class="eyebrow" id="controls-eyebrow"></span>
          <p id="controls-copy"></p>
        </aside>

        <aside class="debug-panel hidden" id="debug-panel" aria-live="off">
          <span class="eyebrow" id="debug-title"></span>
          <p class="debug-panel__row" id="debug-fps"></p>
          <p class="debug-panel__row" id="debug-quality"></p>
          <p class="debug-panel__row" id="debug-draws"></p>
          <p class="debug-panel__row" id="debug-triangles"></p>
        </aside>

        <div class="crosshair" id="crosshair" aria-hidden="true"></div>

        <section class="mobile-controls" id="mobile-controls" aria-label="Mobile controls">
          <div class="control-pad">
            <button class="control-button" data-control="forward" type="button">▲</button>
            <button class="control-button" data-control="left" type="button">◀</button>
            <button class="control-button" data-control="backward" type="button">▼</button>
            <button class="control-button" data-control="right" type="button">▶</button>
          </div>

          <div class="control-pad control-pad--look">
            <button class="control-button" data-control="lookUp" type="button">▲</button>
            <button class="control-button" data-control="turnLeft" type="button">◀</button>
            <button class="control-button" data-control="lookDown" type="button">▼</button>
            <button class="control-button" data-control="turnRight" type="button">▶</button>
          </div>

          <div class="mobile-actions">
            <button class="control-button control-button--wide" data-control="sprint" type="button">
              <span id="mobile-sprint-label"></span>
            </button>
            <button class="control-button control-button--wide" id="mobile-inspect" type="button">
              <span id="mobile-inspect-label"></span>
            </button>
          </div>
        </section>
      </div>
    </div>

    <noscript>
      <div class="noscript">
        <span id="noscript-copy"
          >JavaScript is required for the 3D portfolio.</span
        >
      </div>
    </noscript>

    <script type="module" src="./main.js"></script>
  </body>
</html>
